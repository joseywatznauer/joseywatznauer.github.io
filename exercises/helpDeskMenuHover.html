<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name= "author" content="Josey Watznauer">
<title>Help Desk Menu</title>
<style>
  body {
    padding: 10px;
  }
  nav ul {
    list-style-type: none;
    padding-left: 0px;
  }
  nav li {
    display: inline-block;
    padding: 0px 4px 2px 4px;
    margin: 2px 4px 2px 4px;
    background-color: darkblue;
    border: 3px solid transparent;
    transition-property: border-color;
    transition-duration: 0.5s;
    transition-timing-function: linear;
    transition-delay: 0s;
  }
  nav a {
    font-size: 1em;
    margin: 5px;
    color: lightskyblue;
    text-decoration: none;
    transition-property: font-size, margin;
    transition-duration: 0.5s;
    transition-timing-function: linear;
    transition-delay: 0s;
  }
  nav li:hover{
    border-color: lightskyblue;
  }
  a:hover {
    font-size: 1.5em;
    margin: 10px;
  }
  a:active {
    transition-duration: 0s;
  }
</style>
</head>

<body>
<header>
  <h1>Technical Support Help Desk</h1>
  <nav>
    <ul>
      <li><a href="#">Hours of Operation</a></li>
      <li><a href="#">Chatbot Staff</a></li>
      <li><a href="#">Request Form</a></li>
      <li><a href="#">Additional Ignored Forms</a></li>
    </ul>
  </nav>
  </header>
  </body>
